{% extends 'base.html' %}

{% block title %}Login — MessMate{% endblock %}

{% block content %}
<section class="form-section">
    <div class="form-card">
        <span class="eyebrow">Welcome back</span>
        <h2>Login</h2>

        <form method="POST" class="stacked-form">
            {% csrf_token %}
            <label for="id_username">Username</label>
            <input type="text" id="id_username" name="username" placeholder="Username" required autofocus>

            <label for="id_password">Password</label>
            <input type="password" id="id_password" name="password" placeholder="Password" required>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <p class="form-footer">New here? <a href="{% url 'signup' %}">Create an account</a></p>
    </div>
</section>
{% endblock %}
